# Foundation MCP capability registry (initial)
# Mutation tools require policy gateway approval. Do not expose all tools to all agents.

servers:
  - id: microsoft-fabric-cli
    purpose: Fabric workspace read/import via fab
    authentication_mode: az_fab_login
    mutation_capability: true
    environment_scope: foundation_development_default
    allowed_agent_roles: [fabric_engineer, release_engineer]
    approval_requirements: production_and_legacy_mutations
    audit_requirements: correlation_id_and_command_log
    decision: ADOPT

  - id: microsoft-datafactory-mcp
    purpose: Fabric Data Factory MCP (not classic Azure Data Factory)
    authentication_mode: azure_identity
    mutation_capability: true
    environment_scope: read_first
    allowed_agent_roles: [modernization, discovery, fabric_engineer]
    approval_requirements: any_factory_mutation
    audit_requirements: tool_call_log
    decision: ADAPT
    notes: Classic ADF uses Azure SDK/REST adapters in Foundation, not this MCP.

  - id: azure-devops-mcp
    purpose: Work items, PRs, pipelines
    authentication_mode: ado_pat_or_identity
    mutation_capability: true
    environment_scope: engineering
    allowed_agent_roles: [release_engineer, documentation]
    approval_requirements: PR_create_requires_user_request
    audit_requirements: work_item_traceability
    decision: ADAPT

  - id: rea
    purpose: Authorized reverse engineering investigations
    authentication_mode: local_tools
    mutation_capability: false
    environment_scope: authorized_targets_only
    allowed_agent_roles: [rea_investigator]
    approval_requirements: scope_authorization_required
    audit_requirements: investigation_request_and_evidence
    decision: REFERENCE

  - id: gbp-onprem-sql-readonly
    purpose: Read-only on-prem SQL discovery
    authentication_mode: sql_auth_secret_file
    mutation_capability: false
    environment_scope: read_only
    allowed_agent_roles: [discovery, modernization, quality]
    approval_requirements: none_for_select
    audit_requirements: query_log
    decision: ADOPT_EXISTING
