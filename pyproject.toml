[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-platform"
version = "0.1.0"
description = "The Data Warrior — skills and Forge factory companion (manuscript doctrine, software factory tools)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Randy Archambault" }]
dependencies = [
  "pydantic>=2.7.0,<3",
  "pyyaml>=6.0,<7",
  "networkx>=3.2,<4",
  "typing-extensions>=4.8,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6.0,<1",
  "mypy>=1.11.0,<3",
]
dbt = [
  "dbt-core>=1.8,<2",
]
analysis = [
  "sqlglot>=25.0,<30",
]
local = [
  "duckdb>=1.0,<2",
]

[project.scripts]
forge = "forge.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*", "discovery*", "engineering*", "control*", "demos*", "mcp*"]
exclude = ["tests*", "rebuild*", "docs*", "knowledge*", "automation*", "dbt*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
packages = ["forge", "discovery", "engineering", "control"]
