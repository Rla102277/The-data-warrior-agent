# Foundation SDK + Factory continuous validation (Azure DevOps)
# Does not deploy to Fabric or enable schedules.

trigger:
  branches:
    include:
      - main
      - rebuild/*
      - factory/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -e ".[dev,local]"
    displayName: Install Foundation SDK + Factory

  - script: |
      ruff check foundation discovery engineering control factory demos mcp tests
    displayName: Lint

  - script: |
      python -m pytest tests/unit -q --tb=short
    displayName: Unit tests

  - script: |
      foundation doctor
      foundation policy --actor ci --action update_item --workspace Foundation --name pipeline_x --environment foundation; test $? -eq 2
      foundation modernize --adf tests/fixtures/adf/sample_pipeline.json > $(Agent.TempDirectory)/modernize.json
      forge job demo
    displayName: Doctor, policy negative, modernize, local demo

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: "$(Agent.TempDirectory)/modernize.json"
      artifact: modernization-assessment
    displayName: Publish modernization assessment
    condition: succeededOrFailed()
